name: nms-idp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - nms-idp

  render-realm:
    image: python:3.12-alpine
    env_file: .env
    volumes:
      - ./realm:/realm
      - ./scripts/render-realm.py:/render.py:ro
    command: ["python3", "/render.py"]
    restart: "no"
    networks:
      - nms-idp

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start", "--import-realm"]
    env_file: .env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set KC_BOOTSTRAP_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: ${KC_HOSTNAME:?set KC_HOSTNAME in .env}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-false}
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED:-true}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_MANAGEMENT_HEALTH_ENABLED: "true"
      KC_CACHE: local
    volumes:
      - ./realm/generated:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${KC_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:9000:9000"
    labels:
      - caddy=${KC_PUBLIC_HOST:-auth.newmarketsecurity.com}
      - caddy.reverse_proxy={{upstreams 8080}}
      - traefik.enable=true
      - traefik.docker.network=${EDGE_NETWORK:-proxy}
      - traefik.http.routers.keycloak.rule=Host(`${KC_PUBLIC_HOST:-auth.newmarketsecurity.com}`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls=true
      - traefik.http.routers.keycloak.tls.certresolver=letsencrypt
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
    depends_on:
      postgres:
        condition: service_healthy
      render-realm:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped
    mem_limit: 2g
    networks:
      nms-idp: {}
      edge: {}

volumes:
  postgres_data:

networks:
  nms-idp:
    name: nms-idp
  edge:
    name: ${EDGE_NETWORK:-proxy}
    external: true
